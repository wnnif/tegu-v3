name: Source checkout manifest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standard SHA-256 checksums
        run: sha256sum --check SOURCE-MANIFEST.sha256
      - name: Verify every tracked checkout file
        run: python3 release-tools/source_manifest.py --check
